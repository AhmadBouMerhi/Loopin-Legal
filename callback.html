<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TikTok OAuth Callback</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; line-height: 1.6; color: #222; }
  .code-box { background: #f4f4f4; padding: 20px; border-radius: 8px; word-break: break-all; margin-top: 20px; font-family: monospace; }
  h1 { color: #111; }
</style>
</head>
<body>
<h1>TikTok Authorization Complete</h1>
<p>Copy the code below and paste it back into your terminal.</p>
<div class="code-box" id="output">Loading...</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const state = params.get("state");
  const error = params.get("error");

  const output = document.getElementById("output");
  if (error) {
    output.innerText = "Error: " + error;
  } else if (code) {
    output.innerHTML = "<strong>Code:</strong><br>" + code + "<br><br><strong>State:</strong><br>" + state;
  } else {
    output.innerText = "No code found in URL.";
  }
</script>
</body>
</html>
